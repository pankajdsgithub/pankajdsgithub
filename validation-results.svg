<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Consolas, 'Courier New', monospace">
  <rect width="700" height="400" rx="12" fill="#0D1B2A"/>
  <circle cx="24" cy="22" r="6" fill="#FF5F56"/><circle cx="44" cy="22" r="6" fill="#FFBD2E"/><circle cx="64" cy="22" r="6" fill="#27C93F"/>
  <text x="350" y="27" text-anchor="middle" font-size="12" fill="#7F93AD">sample output - replace with real pipeline logs</text>

  <text x="30" y="68" font-size="15" font-weight="700" fill="#FFFFFF">Terraform Validation</text>
  <text x="30" y="92" font-size="13" fill="#9FB3C8">$ terraform fmt -check</text>
  <text x="30" y="112" font-size="13" fill="#4ADE80">✓ All files are properly formatted</text>
  <text x="30" y="136" font-size="13" fill="#9FB3C8">$ terraform validate</text>
  <text x="30" y="156" font-size="13" fill="#4ADE80">✓ Success! The configuration is valid.</text>

  <text x="30" y="200" font-size="15" font-weight="700" fill="#FFFFFF">Container Security Scan (Trivy)</text>
  <text x="30" y="224" font-size="13" fill="#9FB3C8">$ trivy image --severity HIGH,CRITICAL app:1.0.0</text>
  <text x="30" y="244" font-size="13" fill="#4ADE80">✓ No HIGH or CRITICAL vulnerabilities found</text>

  <text x="30" y="288" font-size="15" font-weight="700" fill="#FFFFFF">Pipeline Build</text>
  <text x="30" y="312" font-size="13" fill="#4ADE80">✓ Pipeline completed successfully</text>
  <text x="30" y="332" font-size="13" fill="#9FB3C8">  Build time: &lt;your real build time&gt;</text>
</svg>
