<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Pankaj Kumar Tiwari | Enterprise Technology and AI Transformation Leader</title>
  <desc id="desc">Executive architecture banner highlighting enterprise Azure, AI transformation, platform engineering, governance, DevSecOps, and application delivery.</desc>

  <defs>
