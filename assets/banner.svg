<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pankaj Kumar - Azure DevOps Architect banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.6" stop-color="#0d2547"/>
      <stop offset="1" stop-color="#0b4f8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#9575ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8z" fill="#7fb8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>

  <!-- Left: text -->
  <text x="60" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Pankaj Kumar</text>
  <rect x="62" y="136" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#cfe6ff">Azure DevOps Architect</text>
  <text x="60" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#9fc3e8">Cloud Engineering  |  Platform Engineering</text>
  <text x="60" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7fa6cc" letter-spacing="0.5">Infrastructure as Code  •  Reusable Pipelines  •  GitOps  •  Cloud Automation</text>

  <!-- Right: delivery flow -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="800" y="70" width="150" height="50" rx="10" fill="#7B42BC" fill-opacity="0.9"/>
    <text x="875" y="101" fill="#fff">Terraform</text>

    <rect x="1000" y="70" width="150" height="50" rx="10" fill="#0078D4" fill-opacity="0.95"/>
    <text x="1075" y="101" fill="#fff">Azure DevOps</text>

    <rect x="800" y="200" width="150" height="50" rx="10" fill="#326CE5" fill-opacity="0.95"/>
    <text x="875" y="231" fill="#fff">AKS + Helm</text>

    <rect x="1000" y="200" width="150" height="50" rx="10" fill="#EF7B4D" fill-opacity="0.95"/>
    <text x="1075" y="231" fill="#fff">Argo CD</text>
  </g>
  <g stroke="#7fb8ff" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-linecap="round">
    <path d="M954 95H994"/>
    <path d="M1075 124V194"/>
    <path d="M996 225H956"/>
  </g>
</svg>
