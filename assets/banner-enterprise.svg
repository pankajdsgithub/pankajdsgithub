<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">Pankaj Kumar Tiwari — Enterprise Technology and AI Transformation Leader</title>
  <desc id="description">Executive profile banner for enterprise cloud architecture, AI transformation, platform engineering and application delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081827"/>
      <stop offset="0.58" stop-color="#102A43"/>
      <stop offset="1" stop-color="#163D63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63D4F4"/>
      <stop offset="1" stop-color="#A8B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020B14" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#background)"/>
  <circle cx="1410" cy="70" r="270" fill="#63D4F4" opacity="0.035"/>
  <circle cx="1490" cy="430" r="220" fill="#A8B8FF" opacity="0.030"/>
  <path d="M760 0V500" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="90" y="108" fill="#FFFFFF" font-size="54" font-weight="700" letter-spacing="1">PANKAJ KUMAR TIWARI</text>
    <rect x="92" y="136" width="118" height="4" rx="2" fill="url(#accent)"/>

    <text x="92" y="202" fill="#9FE4F7" font-size="23" font-weight="700" letter-spacing="3">ENTERPRISE TECHNOLOGY &amp; AI TRANSFORMATION LEADER</text>

    <text x="92" y="262" fill="#FFFFFF" font-size="25" font-weight="600">Azure Solution Architecture</text>
    <circle cx="416" cy="254" r="4" fill="#63D4F4"/>
    <text x="438" y="262" fill="#FFFFFF" font-size="25" font-weight="600">DevSecOps &amp; Platform Engineering</text>

    <text x="92" y="314" fill="#D9E8F3" font-size="21">Enterprise AI Consulting</text>
    <circle cx="360" cy="306" r="4" fill="#63D4F4"/>
    <text x="382" y="314" fill="#D9E8F3" font-size="21">Cloud Transformation</text>
    <circle cx="618" cy="306" r="4" fill="#63D4F4"/>
    <text x="640" y="314" fill="#D9E8F3" font-size="21">Application Delivery</text>

    <text x="92" y="390" fill="#A9C1D4" font-size="18" font-weight="500">Secure architecture · Responsible AI · Intelligent automation · Measurable delivery</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="826" y="78" width="674" height="344" rx="18" fill="#0B2034" fill-opacity="0.92" stroke="#82D4EF" stroke-opacity="0.22"/>

    <text x="866" y="122" fill="#A7DDF0" font-size="14" font-weight="700" letter-spacing="2.2">ENTERPRISE DELIVERY MODEL</text>

    <g transform="translate(866 158)">
      <rect width="594" height="64" rx="12" fill="#163650" stroke="#70CBEC" stroke-opacity="0.28"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#63D4F4"/>
      <text x="32" y="38" text-anchor="middle" fill="#082136" font-size="16" font-weight="800">01</text>
      <text x="62" y="29" fill="#FFFFFF" font-size="18" font-weight="700">Strategy &amp; Architecture</text>
      <text x="62" y="50" fill="#B7CCDA" font-size="14">Business outcomes, roadmap and target-state design</text>
    </g>

    <g transform="translate(866 232)">
      <rect width="594" height="64" rx="12" fill="#163650" stroke="#70CBEC" stroke-opacity="0.28"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#78D5B6"/>
      <text x="32" y="38" text-anchor="middle" fill="#082136" font-size="16" font-weight="800">02</text>
      <text x="62" y="29" fill="#FFFFFF" font-size="18" font-weight="700">Secure Implementation</text>
      <text x="62" y="50" fill="#B7CCDA" font-size="14">Landing zones, automation, governance and delivery</text>
    </g>

    <g transform="translate(866 306)">
      <rect width="594" height="64" rx="12" fill="#163650" stroke="#70CBEC" stroke-opacity="0.28"/>
      <rect x="18" y="18" width="28" height="28" rx="8" fill="#A8B8FF"/>
      <text x="32" y="38" text-anchor="middle" fill="#082136" font-size="16" font-weight="800">03</text>
      <text x="62" y="29" fill="#FFFFFF" font-size="18" font-weight="700">AI Operations &amp; Value</text>
      <text x="62" y="50" fill="#B7CCDA" font-size="14">Evaluation, observability, FinOps and continuous improvement</text>
    </g>
  </g>
</svg>
