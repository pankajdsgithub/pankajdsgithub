
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#123F72"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#65B7FF"/>
    </marker>
  </defs>

  <rect width="1200" height="270" rx="18" fill="url(#bg)"/>
  <text x="40" y="43" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Arial, sans-serif">DEVSECOPS ENGINEERING WORKFLOW</text>
  <text x="40" y="68" fill="#B8D8FA" font-size="13" font-family="Arial, sans-serif">Secure delivery • Infrastructure as Code • Continuous verification</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="28" y="105" width="155" height="88" rx="12" fill="#17365D" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="105" y="139" font-size="17" fill="#FFFFFF" font-weight="700">01 · SOURCE</text>
      <text x="105" y="163" font-size="13" fill="#C8E2FF">Git / Pull Request</text>
    </g>
    <g>
      <rect x="225" y="105" width="155" height="88" rx="12" fill="#17365D" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="302" y="139" font-size="17" fill="#FFFFFF" font-weight="700">02 · BUILD</text>
      <text x="302" y="163" font-size="13" fill="#C8E2FF">CI / Tests / Validate</text>
    </g>
    <g>
      <rect x="422" y="105" width="155" height="88" rx="12" fill="#23365F" stroke="#A78BFA" stroke-width="1.5"/>
      <text x="499" y="139" font-size="17" fill="#FFFFFF" font-weight="700">03 · SECURE</text>
      <text x="499" y="163" font-size="13" fill="#E0D7FF">SAST / IaC / Image Scan</text>
    </g>
    <g>
      <rect x="619" y="105" width="155" height="88" rx="12" fill="#17365D" stroke="#60A5FA" stroke-width="1.5"/>
      <text x="696" y="139" font-size="17" fill="#FFFFFF" font-weight="700">04 · PACKAGE</text>
      <text x="696" y="163" font-size="13" fill="#C8E2FF">Versioned Artifact / Image</text>
    </g>
    <g>
      <rect x="816" y="105" width="155" height="88" rx="12" fill="#154C55" stroke="#5EEAD4" stroke-width="1.5"/>
      <text x="893" y="139" font-size="17" fill="#FFFFFF" font-weight="700">05 · DEPLOY</text>
      <text x="893" y="163" font-size="13" fill="#C8FFF3">Azure / AKS / GitOps</text>
    </g>
    <g>
      <rect x="1013" y="105" width="159" height="88" rx="12" fill="#154C55" stroke="#5EEAD4" stroke-width="1.5"/>
      <text x="1092" y="139" font-size="17" fill="#FFFFFF" font-weight="700">06 · OPERATE</text>
      <text x="1092" y="163" font-size="13" fill="#C8FFF3">Metrics / Logs / Alerts</text>
    </g>
  </g>

  <g stroke="#65B7FF" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M184 149 H218"/>
    <path d="M381 149 H415"/>
    <path d="M578 149 H612"/>
    <path d="M775 149 H809"/>
    <path d="M972 149 H1006"/>
  </g>

  <text x="600" y="232" fill="#D8E9FF" font-size="14" text-anchor="middle" font-family="Arial, sans-serif">Automate → Validate → Secure → Deploy → Observe → Improve</text>
