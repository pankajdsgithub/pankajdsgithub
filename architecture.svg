  <rect width="1000" height="420" rx="12" fill="#F4F8FD" stroke="#D5E3F3"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0B1F3A">DevOps Platform Architecture</text>

